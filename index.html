
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 Interior</title>

<link rel="stylesheet" href="./pannellum.css">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
#panorama {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<div id="panorama"></div>

<script src="./pannellum.js"></script>
<script>

    autoLoad: true,
    showControls: true,
    hfov: 100
});
</script>
</body>
</html>
